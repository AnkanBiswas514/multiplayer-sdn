<!DOCTYPE html>
<html>
<head>
    <title>Multiplayer SDN Game</title>

    <style>
        #game {
            position: relative;
            width: 600px;
            height: 400px;
            border: 2px solid black;
            overflow: hidden;
        }

        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        #P1 {
            background-color: blue;
        }

        #P2 {
            background-color: red;
        }
    </style>
</head>

<body>

    <h1>Multiplayer SDN Game</h1>

    <div id="game">
        <div id="P1" class="player"></div>
        <div id="P2" class="player"></div>
    </div>

    <script src="/static/script.js"></script>

</body>
</html>
